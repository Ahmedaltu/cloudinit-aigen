name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" yamllint
      - run: ruff check cloudinit_aigen/
      - run: mypy cloudinit_aigen/
      - run: pytest tests/ -v --cov=cloudinit_aigen --cov-report=term-missing
