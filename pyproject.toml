[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudinit-aigen"
version = "0.1.0"
description = "Generate cloud-init user-data YAML from natural language using a local or cloud LLM"
authors = [{ name = "Ahmed Al-Tuwaijari", email = "ahmed.altuwaijari@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["cloud-init", "LLM", "automation", "AI", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
cloudinit-aigen = "cloudinit_aigen.cli:main"

[project.urls]
Homepage = "https://github.com/Ahmedaltu/cloudinit-aigen"
Issues = "https://github.com/Ahmedaltu/cloudinit-aigen/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
